# Runs the containerized deliverable: Soloist supervisor + auth Proxy + Snapserver
# under s6-overlay. Host networking is REQUIRED on the deployment target: the
# first-time Spotify login happens over Connect (zeroconf/mDNS on the LAN), which
# does not cross Docker's bridge network — the device would never appear in your
# Spotify app. Host mode also lets LAN Snapclients reach the audio ports directly.
services:
  soloist:
    image: ghcr.io/mintopia/musicparty-soloist:latest
    # build: .                  # uncomment (and comment the image line) to build locally
    network_mode: host          # required for Spotify Connect login + LAN Snapcast
    restart: unless-stopped
    env_file:                   # copy .env.example -> .env and fill in the secrets
      - path: .env
        format: raw             # values are literal — keys containing '$' are NOT interpolated
    volumes:
      - soloist-data:/data      # Soloist session data-dir (holds the login after pairing)
      - soloist-cache:/cache    # downloaded-binary cache

    # macOS / bridge alternative (proxy testing only — CANNOT complete the Spotify
    # login, since Docker Desktop can't put mDNS on your physical LAN). Comment out
    # network_mode above and use:
    # ports:
    #   - "8687:8687"           # auth Proxy (WebSocket control)
    #   - "1704:1704"           # Snapcast audio stream
    #   - "1705:1705"           # Snapcast control (TCP JSON-RPC)
    #   - "1780:1780"           # Snapcast web UI

volumes:
  soloist-data:
  soloist-cache:
