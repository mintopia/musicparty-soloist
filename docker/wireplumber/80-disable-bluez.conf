# Headless container: no Bluetooth, no seat. The bluez monitor pulls in the
# systemd-logind plugin, which fails fatally (exit 70) without a real logind —
# taking WirePlumber down with it (ADR-0003). We only route the virtual
# soloist-sink, so disable the bluez monitor entirely.
#
# WirePlumber 0.5 config format (SPA-JSON): the 0.4 Lua drop-in is no longer read
# (it warns "Lua configuration files are NOT supported" and is ignored). In 0.5,
# monitors are components toggled per profile.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
  }
}
