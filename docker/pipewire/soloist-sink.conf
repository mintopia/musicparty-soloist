# PipeWire drop-in: define the soloist-sink null-sink at daemon startup.
# Loaded from /etc/pipewire/pipewire.conf.d/. The daemon creates this node itself
# as it starts, so the sink is present reliably before any client connects — the
# stable anchor Soloist plays into (ticket 06) and Snapserver captures (ticket 07).
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "soloist-sink"
            node.description        = "Soloist Sink"
            media.class             = Audio/Sink
            object.linger           = true
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
]
