<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First-run setup · Soloist Proxy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap');
    :root{
      /* ground */
      --bg:#f6f6f4; --card:#ffffff; --sub:#fbfbf9; --line:#e9e9e5; --line2:#dcdcd7;
      /* text */
      --txt:#1b1b1a; --dim:#6d6d68; --faint:#9a9a94;
      /* accent (teal) */
      --ind:#0d9488; --ind-h:#0f766e; --ind-s:#e2f5f1;
      /* status */
      --ok:#16a34a; --ok-s:#eafaf0; --bad:#dc2626; --bad-s:#fdeaea;
      --warn:#b45309; --warn-s:#fdf3e7;
      /* type */
      --sans:'Instrument Sans',system-ui,sans-serif;   /* body + UI */
      --disp:'Space Grotesk',system-ui,sans-serif;     /* headings, wordmark, numerics */
      /* elevation */
      --sh:0 1px 2px rgba(20,20,20,.05); --sh2:0 12px 40px rgba(30,30,40,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;
      background-image:
        radial-gradient(680px 420px at 50% -6%, #dcf3ef, transparent 70%),
        radial-gradient(520px 360px at 88% 92%, rgba(6,182,212,.10), transparent 65%)}
    .lbl{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:7px;display:block}
    .field{width:100%;background:var(--sub);border:1px solid var(--line2);border-radius:11px;padding:12px 14px;font-size:14px;color:var(--txt);font-family:var(--sans)}
    .field:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-s)}
    .btn{width:100%;font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:var(--ind);border:none;border-radius:11px;padding:13px;cursor:pointer}
    .btn:hover{background:var(--ind-h)}
    .step{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
    .err{margin-bottom:16px;padding:10px 14px;border-radius:11px;background:var(--bad-s);color:var(--bad);font-size:13px;font-weight:600}
  </style>
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
    <div style="width:440px">
      <div style="text-align:center;margin-bottom:26px">
        <div style="width:52px;height:52px;border-radius:15px;background:linear-gradient(140deg,#14b8a6,#0d9488);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(13,148,136,.30)">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
        <div style="font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:-.015em;margin-top:16px">Welcome to Soloist Proxy</div>
        <div style="font-size:14px;color:var(--dim);margin-top:6px;line-height:1.5">Create the admin account for this console.<br>It's the only step before you sign in.</div>
      </div>

      <form method="POST" action="/setup" style="background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 16px 48px rgba(30,30,40,.12), inset 0 1px 0 rgba(255,255,255,.9);padding:26px">
        <div id="err" class="err" style="display:none">Passwords must match and cannot be empty.</div>
        <div style="margin-bottom:16px"><label class="lbl" for="username">Username</label><input class="field" id="username" name="username" value="admin" autocomplete="username" autofocus required></div>
        <div style="margin-bottom:16px"><label class="lbl" for="password">Password</label><input class="field" id="password" name="password" type="password" autocomplete="new-password" placeholder="Choose a strong password" required></div>
        <div style="margin-bottom:20px"><label class="lbl" for="confirm">Confirm password</label><input class="field" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat it" required></div>
        <button class="btn" type="submit">Create account &amp; continue</button>
        <div style="display:flex;gap:9px;margin-top:18px;padding:12px 14px;background:var(--ind-s);border-radius:11px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ind)" stroke-width="2" style="flex:0 0 auto;margin-top:1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <div style="font-size:12.5px;color:#0b5c54;line-height:1.5">Saved into <b>config.yaml</b>. Everything else — Spotify key, outputs, webhooks — is configured after you sign in.</div>
        </div>
      </form>

      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;color:var(--faint);font-size:12px">
        <span style="display:flex;align-items:center;gap:7px"><span class="step" style="background:var(--ind);color:#fff">1</span>Admin</span>
        <span style="width:22px;height:1px;background:var(--line2)"></span>
        <span style="display:flex;align-items:center;gap:7px"><span class="step" style="background:#ecece8;color:var(--faint)">2</span>Sign in</span>
        <span style="width:22px;height:1px;background:var(--line2)"></span>
        <span style="display:flex;align-items:center;gap:7px"><span class="step" style="background:#ecece8;color:var(--faint)">3</span>Configure</span>
      </div>
      <div style="text-align:center;margin-top:22px;font-size:11px;color:var(--faint)">First-run setup</div>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      var e = document.getElementById("err"); if (e) e.style.display = "block";
    }
    document.querySelector("form").addEventListener("submit", function (ev) {
      var p = document.getElementById("password").value;
      var c = document.getElementById("confirm").value;
      if (!p || p !== c) { ev.preventDefault(); document.getElementById("err").style.display = "block"; }
    });
  </script>
</body>
</html>
