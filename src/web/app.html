<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soloist Proxy</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    .top{max-width:1180px;margin:0 auto;padding:22px 30px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:11px}
    .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#14b8a6,#0d9488);display:inline-flex;align-items:center;justify-content:center}
    .word{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:-.015em}
    .logout{width:auto;padding:9px 16px;font-size:13px;background:var(--card);color:var(--txt);border:1px solid var(--line2)}
    .logout:hover{background:var(--card);border-color:var(--ind);color:var(--ind)}
    .main{max-width:1180px;margin:0 auto;padding:6px 30px 40px}
    .stub{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:28px}
    .stub h1{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 8px}
    .stub p{color:var(--dim);font-size:14px;margin:0}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></span>
      <span class="word">Soloist Proxy</span>
    </div>
    <form method="POST" action="/logout"><button class="btn logout" type="submit">Sign out</button></form>
  </header>
  <main class="main">
    <section class="stub">
      <h1>Signed in</h1>
      <p>The Landing Page lands in a later ticket. You are authenticated behind the Web Session cookie.</p>
    </section>
  </main>
</body>
</html>
