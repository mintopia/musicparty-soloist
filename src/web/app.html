<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soloist Proxy</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    body{background-image:
      radial-gradient(760px 420px at 8% -6%, rgba(13,148,136,.10), transparent 60%),
      radial-gradient(720px 460px at 96% 4%, rgba(6,182,212,.06), transparent 60%);
      background-attachment:fixed}
    .hchip{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.82);background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:4px 11px}
    .hbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
      color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);cursor:pointer}
    .hbtn:hover{background:rgba(255,255,255,.18)}
    .hbtn.act{color:#5eead4;border-color:#5eead4}
    .hplay{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
      color:#06302b;background:linear-gradient(140deg,#5eead4,#2dd4bf);border:none;cursor:pointer;
      box-shadow:0 10px 26px rgba(20,184,166,.5), inset 0 1px 0 rgba(255,255,255,.65)}
    .hplay:hover{filter:brightness(1.05)}
    .lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0;display:inline}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
    .btn{width:auto;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--txt);background:var(--card);
      border:1px solid var(--line2);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
    .btn:hover{border-color:var(--ind);color:var(--ind);background:var(--card)}
    .btn.pri{background:var(--ind);color:#fff;border-color:var(--ind)}
    .btn.pri:hover{background:var(--ind-h);color:#fff}
    .btn:disabled{opacity:.5;cursor:default}
    .row{display:flex;align-items:center;gap:12px}
    .pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
    .sw{width:38px;height:22px;border-radius:20px;position:relative;flex:0 0 auto;cursor:pointer}
    .sw i{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .12s,right .12s}
    .sw.on{background:var(--ind)} .sw.on i{right:2px;left:auto}
    .sw.off{background:#e0e0db} .sw.off i{left:2px;right:auto}
    .field{width:100%;background:var(--sub);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--txt);font-family:var(--sans);margin:0}
    .field:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-s)}
    .field.ro{background:#f1f1ee;color:var(--dim)}
    .qrowd{cursor:default;border-radius:10px} .qrowd:hover{background:rgba(255,255,255,.06)}
    .wrap{min-height:calc(100vh - 58px);padding:24px 30px;max-width:1200px;margin:0 auto}
    .hidden{display:none!important}
    .flabel{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:block}
    /* HSL colour sliders — the inline background gradient is the track (appearance:none), thumb styled here. */
    input.hsl{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;border:1px solid var(--line2);cursor:pointer;outline:none}
    input.hsl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
    input.hsl::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
    input.hsl::-moz-range-track{background:transparent}

    /* top bar + mini player + tab nav */
    #topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:9px 20px;
      background:rgba(246,246,244,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .brandmark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center}
    .brandtxt{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
    #nav{display:flex;gap:2px;flex:0 0 auto;flex-wrap:nowrap}
    .tab{font-size:13px;font-weight:600;color:var(--dim);padding:8px 13px;border-radius:9px;cursor:pointer;border:none;background:transparent;font-family:var(--sans)}
    .tab:hover{color:var(--txt);background:rgba(0,0,0,.03)}
    .tab.act{background:var(--ind-s);color:var(--ind)}
    .spacer{flex:1}
    #miniPlayer{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;background:var(--sub);border:1px solid var(--line);border-radius:14px;min-width:0}
    #mpArt{width:34px;height:34px;border-radius:8px;background-size:cover;background-position:center;background-color:#e5e5e0;flex:0 0 auto}
    .mpmeta{min-width:0;max-width:150px}
    #mpTitle{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mpArtist{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mpctl{display:flex;align-items:center;gap:4px}
    .mpb{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--card);color:var(--txt);cursor:pointer}
    .mpb:hover{border-color:var(--ind);color:var(--ind)}
    .mpplay{background:var(--ind);color:#fff;border-color:var(--ind)}
    .mpplay:hover{background:var(--ind-h);color:#fff}
    .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    .iconbtn:hover{border-color:var(--ind);color:var(--ind)}
    #saveBar{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;justify-content:flex-end;gap:10px;
      padding:12px 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
    /* Single-column form pages share one centered column so the content edge is stable across tabs. */
    .fcol{max-width:720px;margin:0 auto}

    /* Responsive: topbar collapses, two-column pages stack, grids go single-column. */
    @media (max-width:860px){
      #topbar{flex-wrap:wrap;gap:8px 10px;padding:8px 13px}
      .spacer{display:none}
      #wsPill{margin-left:auto}
      #miniPlayer{display:none!important}
      #snapweb{display:none}
      #nav{order:5;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
      .wrap{padding:18px 15px;min-height:auto}
      .ovwrap{grid-template-columns:1fr!important}
      .fgrid{grid-template-columns:1fr!important}
      #saveBar{padding:10px 15px}
    }
  </style>
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <div class="brandmark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
      <div class="brandtxt">Soloist Proxy</div>
    </div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div id="miniPlayer" class="hidden">
      <div id="mpArt"></div>
      <div class="mpmeta"><div id="mpTitle">—</div><div id="mpArtist">—</div></div>
      <div class="mpctl">
        <button id="mpPrev" class="mpb" title="Previous"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg></button>
        <button id="mpPlay" class="mpb mpplay" title="Play/Pause"><svg id="mpPlayIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="mpNext" class="mpb" title="Next"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6L4 18z"/></svg></button>
      </div>
    </div>
    <a id="snapweb" class="btn" href="#" target="_blank" title="Open Snapweb" style="text-decoration:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4M7 6v12M11 3v18M15 8v8M19 5v14"/></svg>Snapweb</a>
    <span id="wsPill" class="pill" style="background:var(--warn-s);color:var(--warn)"><span class="dot" style="background:var(--warn)"></span>Connecting…</span>
    <form method="POST" action="/logout" style="margin:0"><button class="iconbtn" type="submit" title="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button></form>
  </header>

  <div id="banner" class="card hidden" style="border-color:#f0d9a8;background:var(--warn-s);padding:13px 16px;margin:16px auto 0;max-width:1200px;box-shadow:none">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:11px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2.2" stroke-linecap="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div><div style="font-size:14px;font-weight:600;color:#7c4a09">Configuration changed — restart soloist to apply</div>
          <div style="font-size:12.5px;color:var(--warn);margin-top:1px">Applying interrupts playback.</div></div>
      </div>
      <button id="restartBtn" class="btn pri" style="background:var(--warn);border-color:var(--warn)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>Restart soloist</button>
    </div>
  </div>

  <main id="view" class="wrap"></main>

  <div id="saveBar" class="hidden">
    <span id="cfgMsg" style="font-size:12.5px;color:var(--dim)"></span>
    <button class="btn" id="cfgDiscard">Discard</button>
    <button class="btn pri" id="cfgSave">Save changes</button>
  </div>

<script type="module" src="/app.js"></script>
</body>
</html>
