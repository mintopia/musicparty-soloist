<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrics Overlay</title>
  <style>
    /* Transparent for OBS/browser-source compositing; the engine injects its own
       styles + fonts and reads styling from the server-embedded Overlay Config. */
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:transparent;overflow:hidden}
    #overlay{position:fixed;inset:0}
  </style>
</head>
<body>
  <div id="overlay"></div>
  <!--__OVERLAY_BOOTSTRAP__-->
  <script type="module" src="/overlay.js"></script>
</body>
</html>
