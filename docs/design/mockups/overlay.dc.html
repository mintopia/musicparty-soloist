<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@500;600&display=swap');
    *{box-sizing:border-box}
    body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif}
    .scene{position:absolute;inset:0;overflow:hidden;
      background:linear-gradient(160deg,#20304a 0%,#3a2b52 55%,#4a2740 100%)}
    .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5}
    .lyr{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;line-height:1.15;letter-spacing:-.01em}
  </style>
</helmet>
<div style="position:relative;width:1280px;height:720px;overflow:hidden;background:#0e0f13">

  <!-- SAMPLE STREAM SCENE (to show transparency) -->
  <div class="scene">
    <div class="blob" style="width:360px;height:360px;left:-60px;top:-80px;background:#5b6cff"></div>
    <div class="blob" style="width:300px;height:300px;right:-40px;top:40px;background:#ff6b9d"></div>
    <div class="blob" style="width:420px;height:420px;right:120px;bottom:-160px;background:#3ad0c0;opacity:.35"></div>
    <!-- fake game HUD bits -->
    <div style="position:absolute;top:26px;left:30px;display:flex;gap:10px;align-items:center;color:#ffffffcc;font-weight:600;font-size:15px">
      <div style="width:34px;height:34px;border-radius:8px;background:#ffffff22;border:1px solid #ffffff33"></div>SAMPLE SCENE · 1280×720</div>
    <div style="position:absolute;top:26px;right:30px;color:#ffffffaa;font-size:14px;font-weight:600">◍ REC 41:12</div>
    <div style="position:absolute;bottom:26px;left:30px;display:flex;gap:8px">
      <div style="width:120px;height:8px;border-radius:5px;background:#ffffff2a"></div>
      <div style="width:60px;height:8px;border-radius:5px;background:#ffffff2a"></div></div>
  </div>

  <!-- THE OVERLAY (transparent bg; anchored bottom-center) -->
  <div style="position:absolute;left:0;right:0;bottom:64px;text-align:center;padding:0 80px">
    <div class="lyr" style="font-size:26px;color:#ffffff;opacity:.34;margin-bottom:14px;text-shadow:0 2px 10px rgba(0,0,0,.6)">I said, ooh, I'm blinded by the lights</div>
    <div class="lyr" style="font-size:52px;color:#ffffff;margin-bottom:16px;
        text-shadow:0 0 24px rgba(45,212,191,.6), 0 3px 12px rgba(0,0,0,.7);
        -webkit-text-stroke:1px rgba(0,0,0,.25)">No, I can't sleep until I feel your touch</div>
    <div class="lyr" style="font-size:26px;color:#ffffff;opacity:.34;text-shadow:0 2px 10px rgba(0,0,0,.6)">I said, ooh, I'm drowning in the night</div>
  </div>

  <!-- corner now-playing chip (part of overlay) -->
  <div style="position:absolute;left:30px;bottom:120px;display:flex;gap:11px;align-items:center;
      background:rgba(10,10,14,.42);backdrop-filter:blur(8px);border:1px solid #ffffff22;border-radius:12px;padding:9px 13px">
    <div style="width:34px;height:34px;border-radius:7px;background:linear-gradient(135deg,#2dd4bf,#06b6d4);flex:0 0 auto"></div>
    <div><div style="color:#fff;font-weight:700;font-size:14px">Blinding Lights</div>
      <div style="color:#ffffffaa;font-size:12px">The Weeknd</div></div>
  </div>

  <!-- caption (not part of overlay; canvas note) -->
  <div style="position:absolute;top:26px;left:50%;transform:translateX(-50%);background:#000000aa;color:#fff;font-size:11px;font-weight:600;letter-spacing:.05em;padding:5px 12px;border-radius:20px">
    TRANSPARENT OVERLAY — shown over a sample scene · styled from Overlay Config</div>
</div>
</x-dc>
</body>
</html>
