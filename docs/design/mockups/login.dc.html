<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap');
    :root{
      --bg:#f6f6f4; --card:#ffffff; --sub:#fbfbf9; --line:#e9e9e5; --line2:#dcdcd7;
      --txt:#1b1b1a; --dim:#6d6d68; --faint:#9a9a94; --ind:#0d9488; --ind-h:#0f766e; --ind-s:#e2f5f1;
      --sans:'Instrument Sans',system-ui,sans-serif; --disp:'Space Grotesk',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;
      background-image:
        radial-gradient(620px 380px at 50% -8%, #dcf3ef, transparent 70%),
        radial-gradient(460px 320px at 90% 94%, rgba(6,182,212,.09), transparent 65%)}
    a{color:var(--ind);text-decoration:none} a:hover{color:var(--ind-h)}
    .lbl{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:7px;display:block}
    .field{width:100%;background:var(--sub);border:1px solid var(--line2);border-radius:11px;padding:12px 14px;font-size:14px;color:var(--txt);font-family:var(--sans)}
    .field.ph{color:var(--faint)}
    .field.focus{border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-s)}
    .btn{width:100%;font-size:14px;font-weight:600;color:#fff;background:var(--ind);border:none;border-radius:11px;padding:13px;cursor:pointer;font-family:var(--sans)}
    .btn:hover{background:var(--ind-h)}
  </style>
</helmet>
<div style="min-height:680px;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:400px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(140deg,#14b8a6,#0d9488);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(13,148,136,.28)">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
      <div style="font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:15px">Sign in to Soloist Proxy</div>
    </div>
    <div style="background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 16px 48px rgba(30,30,40,.12), inset 0 1px 0 rgba(255,255,255,.9);padding:26px">
      <div style="margin-bottom:16px"><label class="lbl">Username</label><div class="field">admin</div></div>
      <div style="margin-bottom:22px"><label class="lbl">Password</label><div class="field focus ph">••••••••••</div></div>
      <button class="btn">Sign in</button>
    </div>
    <div style="text-align:center;margin-top:22px;font-size:12px;color:var(--faint)">Session kept in a signed, HttpOnly cookie · Login · Clean &amp; Light</div>
  </div>
</div>
</x-dc>
</body>
</html>
