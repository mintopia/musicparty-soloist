# Soloist Proxy config. Copy to config.yaml and fill in the secrets via env.
# Override any value with ${VAR} / ${VAR:-default} interpolation; env wins over
# the file default. (The binary cache/download read $SOLOIST_CACHE_DIR and
# $SOLOIST_DOWNLOAD_BASE directly, not through this file.)

soloist:
  device_name: "${SOLOIST_DEVICE_NAME:-Music Party}"
  api_key: "${SOLOIST_API_KEY}"   # Spotify API Key; supply via env, never commit
  data_dir: "${SOLOIST_DATA_DIR:-./.soloist-data}"  # persistent session state
  extra_args: []
  # Docker-only: PipeWire null-sink to play into. Empty in standalone (no audio path).
  pipewire_device: "${SOLOIST_PIPEWIRE_DEVICE:-}"

proxy:
  listen: "${PROXY_LISTEN:-0.0.0.0:8687}"
  token: "${PROXY_TOKEN}"          # Auth Token gating the Proxy; supply via env

soloist_ws: "127.0.0.1:3678"

# When true, once Soloist logs in the Hub makes this device the active Connect
# player and starts playing (injects activate then play, once per connection).
autoplay: "${AUTOPLAY:-false}"

# Outbound HTTP POST per Soloist event (raw event JSON, Content-Type application/json).
# Best-effort: fire-and-forget, ~5s timeout, non-2xx/timeout logged, never retried.
# Omit the section entirely to disable (relay behaves exactly as without it).
webhooks:
  default_url: "${WEBHOOK_URL:-}"   # catch-all for the ten state events; empty = off
  urls: {}                          # per-type overrides that REPLACE the default, e.g.
                                    #   track_changed: "https://example/track"
                                    #   error: "https://example/errors"  # only fires if listed
  secret: "${WEBHOOK_SECRET:-}"     # optional; sent as Authorization: Bearer <secret>
  delay_ms: "${WEBHOOK_DELAY_MS:-0}"  # global min interval between POSTs (0 = off)

snapcast:
  stream_name: "${SNAPCAST_STREAM:-Spotify}"   # Docker-only
