# Soloist Proxy config. Copy to config.yaml and fill in the values below.
# This file is the single source of truth: no environment variables, no ${VAR}
# interpolation — every value is used literally. Edit by hand or via the Landing
# Page (which writes this file back, preserving your comments).
# Path is set by --config (default ./config.yaml; /config/config.yaml in Docker).

soloist:
  device_name: "Music Party"      # name shown in Spotify Connect
  api_key: ""                     # Spotify API Key (required) — kept in cleartext here
  data_dir: "/data"               # persistent session state (Docker volume);
                                  # use "./.soloist-data" when running standalone
  extra_args: []
  # Docker-only: PipeWire null-sink to play into. Empty in standalone (no audio path).
  pipewire_device: ""

proxy:
  listen: "0.0.0.0:8687"
  token: ""                       # Auth Token gating the Proxy (required)
  readonly_token: ""              # observe-only token for the Lyrics Overlay;
                                  # autogenerated on first boot if left empty

soloist_ws: "127.0.0.1:3678"

# Web UI (Landing Page) credentials. Leave username/password empty on a fresh
# install to get the unauthenticated Setup Page. session_secret signs the login
# cookie and is autogenerated on first boot if left empty.
web:
  username: ""
  password: ""
  session_secret: ""

# When true, once Soloist logs in the Hub makes this device the active Connect
# player and starts playing (injects activate then play, once per connection).
autoplay: false

# Outbound HTTP POST per Soloist event (raw event JSON, Content-Type application/json).
# Best-effort: fire-and-forget, ~5s timeout, non-2xx/timeout logged, never retried.
# Omit the section entirely to disable (relay behaves exactly as without it).
webhooks:
  default_url: ""                 # catch-all for the ten state events; empty = off
  urls: {}                        # per-type overrides that REPLACE the default, e.g.
                                  #   track_changed: "https://example/track"
                                  #   error: "https://example/errors"  # only fires if listed
  secret: ""                      # optional; sent as Authorization: Bearer <secret>
  delay_ms: 0                     # global min interval between POSTs (0 = off)

snapcast:
  stream_name: "Spotify"          # Docker-only

# Audio Outputs (Docker-only). Soloist's audio is fanned out to these. `outputs`
# lists enabled hardware sinks by PipeWire node.name; `snapcast` toggles the
# Snapcast output (on by default).
audio:
  outputs: []
  snapcast: true

# Lyrics Overlay styling. The Proxy embeds this subset into the served overlay page.
overlay:
  font: "sans-serif"
  font_size: 48
  color: "#ffffff"
  highlight_color: "#1db954"
  effect: "fade"
  alignment: "center"
  timing_offset_ms: 0
  line_count: 3
  anchor: "bottom"
