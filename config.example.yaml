# Soloist Proxy config. Copy to config.yaml and fill in the values below.
# Every value is used literally. No environment variables, no ${VAR} interpolation.
# Edit by hand or in the web interface, which writes this file back and keeps your comments.
# Path is set by --config (default ./config.yaml; /config/config.yaml in Docker).

soloist:
  device_name: "Music Party"      # name shown in Spotify Connect
  api_key: ""                     # Spotify API Key (required), stored here in cleartext
  data_dir: "/data"               # persistent session state (Docker volume);
                                  # use "./.soloist-data" when running standalone
  extra_args: []
  # PipeWire node Soloist outputs to. Docker uses the soloist-sink null-sink (set by
  # the container). In standalone, set a device node.name here (or pass --pipewire-device)
  # to pick an output, or leave empty for Soloist's default sink.
  pipewire_device: ""

proxy:
  listen: "0.0.0.0:8687"
  token: ""                       # Auth Token gating the Proxy (required)
  readonly_token: ""              # observe-only token for the Lyrics Overlay;
                                  # autogenerated on first boot if left empty

soloist_ws: "127.0.0.1:3678"

# Web interface credentials. Leave username/password empty on a fresh install to
# get the unauthenticated setup page. session_secret signs the login cookie and is
# autogenerated on first boot if left empty.
web:
  username: ""
  password: ""
  session_secret: ""

# When true, once Soloist logs in the Hub makes this device the active Connect
# player and starts playing (injects activate then play, once per connection).
# The last volume Soloist reported is restored afterwards, since activating the
# device would otherwise reset it to 100%.
autoplay: false

# Outbound HTTP POST per Soloist event (raw event JSON, Content-Type application/json).
# Best-effort: fire-and-forget, ~5s timeout, non-2xx/timeout logged, never retried.
# Omit the section entirely to disable (relay behaves exactly as without it).
webhooks:
  default_url: ""                 # catch-all for the ten state events; empty = off
  urls: {}                        # per-type overrides that REPLACE the default, e.g.
                                  #   track_changed: "https://example/track"
                                  #   error: "https://example/errors"  # only fires if listed
  secret: ""                      # optional; sent as Authorization: Bearer <secret>
  delay_ms: 0                     # global min interval between POSTs (0 = off)

# Outbound WebSocket relay (bridge). When url is set, the proxy opens a persistent
# connection to it, republishes every Soloist frame verbatim, and relays every frame
# it receives back to Soloist as a command (full control). Reconnects with backoff;
# leave url empty to disable.
relay:
  url: ""                         # ws:// or wss:// Relay Server; empty = off
  authorization: ""               # optional, sent verbatim as the Authorization header

snapcast:
  stream_name: "Spotify"          # Docker-only

# Audio Outputs (Docker-only). Soloist's audio is fanned out to these. `outputs`
# lists enabled hardware sinks by PipeWire node.name; `snapcast` toggles the
# Snapcast output (on by default).
audio:
  outputs: []
  snapcast: true

# Lyrics Overlay styling. The Proxy embeds this into the served overlay page; edit
# here or in the web interface (Overlay section) with a live preview.
overlay:
  font: "system-ui, sans-serif" # or Inter / Roboto / Montserrat / Bebas Neue / monospace
  font_size: 40                 # px at 1080p
  color: "#ffffff"              # current line
  neighbour_color: "#ffffff"    # other lines
  dim_opacity: 0.35             # other-line opacity, 0..1
  motion: "slide"               # slide | crossfade | pop | instant
  easing: "cubic-bezier(.16,1,.3,1)"
  transition_ms: 350            # line-advance duration
  effect: "none"                # none|glow|shimmer|rainbow|sparkles|wipe|neon|glitch|pulse
  fx_color: "#ffd24a"
  fx_intensity: 50              # 0..100
  fx_dur_ms: 1600               # effect period
  alignment: "center"           # left | center | right
  anchor: "bottom"              # top | center | bottom
  line_count: 3                 # visible lines (odd)
  timing_offset_ms: 0
